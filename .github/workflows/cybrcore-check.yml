# Deprecated alias of chromekit-check.yml. Kept so callers that still use this path on a SHA
# that includes this commit keep working. New CI should call chromekit-check.yml.
# Reusable chromekit check for apps that consume chromekit as a git submodule.
#
#   jobs:
#     chromekit:
#       uses: Oni3xe/cybr-chromekit/.github/workflows/chromekit-check.yml@<tag commit SHA> # pin to the tag SHA
#
# It checks out the calling repo with its submodules, then runs chromekit's generator in --check
# mode (the generated Tokens.kt and friends must match chromekit/tokens/tokens.json at the pinned
# chromekit.version, with a deprecated fallback to cybrcore.version) and the UI standard checker,
# both driven by the app's chromekit.json.
name: cybrcore-check

on:
  workflow_call:
    inputs:
      kit-path:
        description: Path of the chromekit checkout inside the calling repo
        type: string
        default: chromekit
      config:
        description: Path of the app's chromekit.json
        type: string
        default: chromekit.json

permissions:
  contents: read

jobs:
  check:
    name: chromekit tokens and standard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The chromekit submodule must be readable by this job's token (see README "CI access").
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          submodules: true
          persist-credentials: false

      - name: chromekit tokens in sync
        env:
          KIT: ${{ inputs.kit-path }}
          CONFIG: ${{ inputs.config }}
        run: python3 "$KIT/tools/gen_tokens.py" --config "$CONFIG" --check

      - name: chromekit standard checks
        env:
          KIT: ${{ inputs.kit-path }}
          CONFIG: ${{ inputs.config }}
        run: python3 "$KIT/tools/check_standard.py" --config "$CONFIG"
