name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same PR cancels the older run; pushes to main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The kit checks itself with the same reusable workflow the apps call.
  chromekit:
    uses: ./.github/workflows/chromekit-check.yml
    with:
      kit-path: "."

  fonts:
    name: font bytes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Fonts match fonts/SHA256SUMS
        working-directory: fonts
        run: sha256sum -c SHA256SUMS
